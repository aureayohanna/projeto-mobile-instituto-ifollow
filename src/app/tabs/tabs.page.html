<ion-tabs>

  <ion-header *ngIf="selectedTab === 'tab8'">
    <ion-toolbar class="toolbar">
      <ion-buttons slot="start">
        <ion-icon class="seta-voltar" slot="start" name="chevron-back-outline" (click)="voltarParaPaginaAnterior()"></ion-icon>
      </ion-buttons>
      <ion-title class="perfil">Perfil</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-header *ngIf="selectedTab === 'tab9'">
    <ion-toolbar class="toolbar">
      <ion-buttons slot="start">
        <ion-icon class="seta-voltar" slot="start" name="chevron-back-outline" (click)="voltarParaPaginaAnterior()"></ion-icon>
      </ion-buttons>
      <ion-title class="perfil">Meus Dados</ion-title>
    </ion-toolbar>
  </ion-header>

<ion-menu contentId="main-content" *ngIf="selectedTab !== 'tab8' && selectedTab !== 'tab9'">
  <ion-header>
    <ion-toolbar>
      <ion-title class="menu-title">Menu</ion-title>
      <img class="x" (click)="fecharMenu()" src="../../assets/imgs/x.svg"/>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <ion-list class="lista-menu">
      <a href="/tabs/tab1">
        <ion-item>
        <img class="icons-menu" src="../../assets/imgs/home.svg"/>
        <ion-label class="texto-menu">Home</ion-label>
        <ion-icon class="seta-menu" name="chevron-forward-outline"></ion-icon>
      </ion-item>
      </a>
      <a href="/tabs/tab2">
      <ion-item>
        <img class="icons-menu" src="../../assets/imgs/icon-doar.svg"/>
        <ion-label class="texto-menu">Doar</ion-label>
        <ion-icon class="seta-menu" name="chevron-forward-outline"></ion-icon>
      </ion-item>
      </a>
      <a href="/tabs/tab3">
      <ion-item>
        <img class="icons-menu" src="../../assets/imgs/icon-adotar.svg"/>
        <ion-label class="texto-menu">Adotar</ion-label>
        <ion-icon class="seta-menu" name="chevron-forward-outline"></ion-icon>
      </ion-item>
      </a>
      <a href="/tabs/tab4">
      <ion-item>
        <img class="icons-menu" src="../../assets/imgs/icon-apadrinhar.svg"/>
        <ion-label class="texto-menu">Apadrinhar</ion-label>
        <ion-icon class="seta-menu" name="chevron-forward-outline"></ion-icon>
      </ion-item>
      </a>
      <a href="/tabs/tab8">
      <ion-item>
        <img class="icons-menu" src="../../assets/imgs/icon-perfil.svg"/>
        <ion-label class="texto-menu">Meu Perfil</ion-label>
        <ion-icon class="seta-menu" name="chevron-forward-outline"></ion-icon>
      </ion-item>
      </a>
      <a href="/tabs/tab9">
      <ion-item>
        <img class="icons-menu" src="../../assets/imgs/icon-dados.svg"/>
        <ion-label class="texto-menu">Meus Dados</ion-label>
        <ion-icon class="seta-menu" name="chevron-forward-outline"></ion-icon>
      </ion-item>
    </a>
    </ion-list>
    <div class="btn-sair-container">
    <a href="/inicio">
    <ion-button fill="outline" class="btn-sair" (click)="signOut()">Sair<img class="icon-sair" src="../../assets/imgs/icon-sair.svg"/></ion-button>
    </a>
  </div>
  </ion-content>
</ion-menu>

<ion-header slot="top" *ngIf="selectedTab !== 'tab8' && selectedTab !== 'tab9'">
  <ion-toolbar id="ion-toolbar">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <div class="perfil-logo-container">
      <ion-img class="logo-rosa" src="assets/imgs/afoloulogorosasvg.svg"></ion-img>
      <a href="/tabs/tab8">
        <ion-thumbnail id="imgperfil">
          <img class="imgperfil" [src]="profilePictureUrl"/>
        </ion-thumbnail>
      </a>
    </div>
  </ion-toolbar>
</ion-header>
